name: Release

on:
  workflow_run:
    workflows: ["Monorepo Split"]
    types:
      - completed

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag and release changed tools
    # Only run when the split that triggered this finished successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the split commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Release changed tools
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/release.sh
