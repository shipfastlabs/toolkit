name: Monorepo Split

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    name: Create mirrors and split

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install splitsh-lite
        env:
          SPLITSH_VERSION: v1.0.1
          SPLITSH_SHA256: 2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/splitsh/lite/releases/download/${SPLITSH_VERSION}/lite_linux_amd64.tar.gz" \
            -o splitsh-lite.tar.gz
          echo "${SPLITSH_SHA256}  splitsh-lite.tar.gz" | sha256sum --check --strict
          tar -xzf splitsh-lite.tar.gz
          sudo mv splitsh-lite /usr/local/bin/splitsh-lite
          rm splitsh-lite.tar.gz

      - name: Create mirror repositories for any new tools
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: bash tools/create-repos.sh

      - name: Split changed tool folders into their mirrors
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: bash tools/split.sh
